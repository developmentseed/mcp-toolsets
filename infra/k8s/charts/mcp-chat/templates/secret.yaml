{{- if and .Values.provider.apiKey (not .Values.provider.existingSecret) }}
# The provider key the deploy passed in. Templated here rather than required to
# exist beforehand, so a first deploy needs one GitHub secret and no manual
# kubectl. Bring your own with `provider.existingSecret` if it should be
# managed outside Helm — a value set here is readable in `helm get values`.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-chat-provider
  labels:
    {{- include "mcp-chat.labels" . | nindent 4 }}
type: Opaque
stringData:
  provider-api-key: {{ .Values.provider.apiKey | quote }}
{{- end }}
