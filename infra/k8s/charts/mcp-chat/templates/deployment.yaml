apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-chat
  labels:
    {{- include "mcp-chat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "mcp-chat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-chat.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: mcp-chat
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: MCP_URL
              value: {{ .Values.mcpUrl | quote }}
            # The model is the deployment's, and so is the bill. The key is
            # never a value here: it is read from a Secret, either this chart's
            # own or one named in `provider.existingSecret`.
            - name: PROVIDER_MODEL
              value: {{ required "provider.model is required" .Values.provider.model | quote }}
            - name: PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.provider.existingSecret | default "mcp-chat-provider" }}
                  key: {{ if .Values.provider.existingSecret }}{{ .Values.provider.existingSecretKey }}{{ else }}provider-api-key{{ end }}
            {{- with .Values.ui.title }}
            - name: MCP_AGENT_UI_TITLE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.tagline }}
            - name: MCP_AGENT_UI_TAGLINE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.greeting }}
            - name: MCP_AGENT_UI_GREETING
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.examples }}
            # One question per line: the runtime reads this variable as lines
            # or as a JSON array, and a block scalar is what a values file
            # writes a list of sentences as.
            - name: MCP_AGENT_UI_EXAMPLES
              value: |-
                {{- range . }}
                {{ . }}
                {{- end }}
            {{- end }}
            {{- with .Values.ui.accent }}
            - name: MCP_AGENT_UI_ACCENT
              value: {{ . | quote }}
            {{- end }}
          # Two probes rather than one, because they fail differently: the
          # agent connects to every toolset before it can answer, and readiness
          # is 503 for as long as that takes. A liveness probe on the same
          # route would restart a process that is doing nothing wrong.
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
