[project]
name = "ask-demo"
version = "0.1.0"
description = "Example toolset demonstrating a tool that asks the user a question."
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain-core<2.0.0,>=1.4.6",
    "mcp-toolsets-runtime",
    "pydantic[email]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
