[project]
name = "stac-explorer"
version = "0.1.0"
description = "Search a public STAC catalog and preview collections on a map — a toolset with React views."
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain-core<2.0.0,>=1.4.6",
    "mcp-toolsets-runtime",
    "httpx<1.0.0,>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Views are built by the ui/ Vite project into the package's views/ dir; ship
# them in the wheel even though they are git-ignored build artifacts.
artifacts = ["src/stac_explorer/views/*.html"]
