[project]
name = "mcp-cli"
version = "0.1.0"
description = "Typer CLI for listing and calling tools on an MCP service."
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp<2.0.0,>=1.27.2",
    "typer<0.27.0,>=0.26.7",
    "rich<16.0.0,>=15.0.0",
]

[project.scripts]
mcp-cli = "mcp_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
