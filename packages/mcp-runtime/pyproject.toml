[project]
name = "mcp-runtime"
version = "0.1.0"
description = "Shared runtime that discovers LangChain tools and serves them as an MCP server."
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp<2.0.0,>=1.27.2",
    "langchain-mcp-adapters<0.4.0,>=0.3.0",
    "langchain-core<2.0.0,>=1.4.6",
    "pydantic-settings<3.0.0,>=2.12.0",
    "fastapi<1.0.0,>=0.136.3",
]

[project.scripts]
mcp-serve = "mcp_runtime.server:main"
mcp-index = "mcp_runtime.index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
