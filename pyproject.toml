[project]
name = "mcp-toolsets"
version = "0.1.0"
description = "Monorepo of toolsets - atomic packages of LangChain tools - each auto-deployed as an MCP service."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # The shared runtime, installed from PyPI — mcp_runtime (mcp-serve /
    # mcp-index), mcp_cli, mcp_toolset, and with [agent] the Chainlit chat host.
    # Upgrade by bumping this range and running `uv lock`.
    "mcp-toolsets-runtime[agent]<0.3.0,>=0.2.0",
    "credential-demo",
    "hello",
    "stac-explorer",
]

[dependency-groups]
# The index image serves the directory, not tools — it needs the runtime and
# none of the toolsets. `uv sync --only-group index` in the Dockerfile installs
# exactly this, at the version uv.lock already pins for everything else.
index = ["mcp-toolsets-runtime"]
# Likewise for the hosted chat image (Dockerfile.chat): the agent and its
# Chainlit stack, no toolsets.
chat = ["mcp-toolsets-runtime[agent]"]
dev = [
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio<2.0.0,>=1.4.0",
    "ruff<0.15.0,>=0.14.11",
    "mypy<2.0.0,>=1.19.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["toolsets/*"]

# Only the toolsets are local; the runtime resolves from PyPI like any other
# third-party dependency.
[tool.uv.sources]
credential-demo = { workspace = true }
hello = { workspace = true }
stac-explorer = { workspace = true }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests", "toolsets"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["langchain_mcp_adapters.*"]
ignore_missing_imports = true
