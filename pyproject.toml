[project]
name = "mcp-toolsets"
version = "0.1.0"
description = "Monorepo of toolsets - atomic packages of LangChain tools - each auto-deployed as an MCP service."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # The shared runtime, installed from PyPI — mcp_runtime (mcp-serve /
    # mcp-index), mcp_cli, mcp_toolset, and with [api] the agent over HTTP plus
    # the web client it serves. [api] is here for the dev environment, which
    # runs the chat locally; the toolset images sync with `--package` and so
    # never see it. Upgrade by bumping this range and running `uv lock`.
    "mcp-toolsets-runtime[api]<0.10.0,>=0.9.0",
    "credential-demo",
    "hello",
    "stac-explorer",
]

[dependency-groups]
# target:k8s
# The index image serves the directory, not tools — it needs the runtime and
# none of the toolsets. `uv sync --only-group index` in the Dockerfile installs
# exactly this, at the version uv.lock already pins for everything else.
index = ["mcp-toolsets-runtime"]
# /target:k8s
# target:aws
# The same directory, for the AWS target. It discovers toolsets through the ECS
# and Cloud Map APIs, which is the runtime's [aws] extra — a separate group so a
# cluster deployment's image does not carry an AWS SDK it never calls.
index-aws = ["mcp-toolsets-runtime[aws]"]
# /target:aws
# Likewise for the hosted chat image (Dockerfile.chat): the agent over HTTP
# and the web client the runtime serves with it, no toolsets. [api] rather than
# [web] since 0.8.4 — the chat is an AG-UI service now, and Chainlit is gone
# from this repo entirely.
chat = ["mcp-toolsets-runtime[api]"]
# target:aws
# The AWS deployment target: the CDK app under infra/. A group rather than a
# dependency so the k8s path never installs it, and so bootstrap drops the
# group with the directory. `uv run --group infra` is how anything here runs.
infra = [
    "aws-cdk-lib<3.0.0,>=2.268.0",
    "constructs<11.0.0,>=10.8.1",
    # infra.config reads each toolset's toolset.aws.yaml.
    "pyyaml<7.0.0,>=6.0.3",
    "types-pyyaml<7.0.0,>=6.0.12.20260815",
]
# /target:aws
dev = [
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio<2.0.0,>=1.4.0",
    "ruff<0.15.0,>=0.14.11",
    "mypy<2.0.0,>=1.19.1",
]

# What `mcp-toolset new` writes into a new toolset for each deployment target.
# Declared here rather than guessed from directory names: these files name this
# repo's own paths, so the templates live beside the things that read them —
# the chart values, and the stack. `scripts/prune-target` drops the entry for
# the target it removes, along with that file in every existing toolset.
[tool.mcp-toolset]
deployment-config = [
    # target:k8s
    { path = "toolset.yaml", template = "infra/k8s/toolset.template.yaml" },
    # /target:k8s
    # target:aws
    { path = "toolset.aws.yaml", template = "infra/cdk/toolset.template.yaml" },
    # /target:aws
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["toolsets/*"]

# Only the toolsets are local; the runtime resolves from PyPI like any other
# third-party dependency.
[tool.uv.sources]
credential-demo = { workspace = true }
hello = { workspace = true }
stac-explorer = { workspace = true }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests", "toolsets"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["langchain_mcp_adapters.*"]
ignore_missing_imports = true
