name: Deploy

on:
  push:
    branches: [main]
  # Manual full deploy of every toolset (e.g. after fixing the workflow itself,
  # which isn't a path changed-toolsets rebuilds for).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # The deploy namespace is per-instance config supplied as a repo Actions
  # variable, never a committed value — so it does not copy into repos generated
  # from this template. Empty until set, which (with KUBE_CONFIG) gates every
  # cluster-touching job below.
  MCP_NAMESPACE: ${{ vars.MCP_NAMESPACE }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      toolsets: ${{ steps.changed.outputs.toolsets }}
      ingress: ${{ steps.ingress.outputs.enabled }}
      deploy: ${{ steps.deploy.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            range=""  # unusable range => changed-toolsets selects all
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "toolsets=$(./scripts/changed-toolsets "$range")" >> "$GITHUB_OUTPUT"
      - id: ingress
        env:
          MCP_INGRESS_HOST: ${{ secrets.MCP_INGRESS_HOST }}
        run: echo "enabled=${MCP_INGRESS_HOST:+true}" >> "$GITHUB_OUTPUT"
      # A fresh template instance has neither a kubeconfig nor a namespace, so
      # skip every job that touches a cluster — CI stays green until both the
      # KUBE_CONFIG secret and the MCP_NAMESPACE variable are configured.
      - id: deploy
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          enabled=""
          if [ -n "$KUBE_CONFIG" ] && [ -n "$MCP_NAMESPACE" ]; then
            enabled="true"
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.toolsets != '[]' && needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolset: ${{ fromJSON(needs.detect.outputs.toolsets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: image
        name: Compute image name (ghcr requires lowercase)
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY@L}/mcp-${{ matrix.toolset }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          build-args: TOOLSET=${{ matrix.toolset }}
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=mcp-${{ matrix.toolset }}
          cache-to: type=gha,scope=mcp-${{ matrix.toolset }},mode=max
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      - name: Deploy with Helm
        env:
          MCP_INGRESS_HOST: ${{ secrets.MCP_INGRESS_HOST }}
        run: |
          values=""
          if [ -f "toolsets/${{ matrix.toolset }}/toolset.yaml" ]; then
            values="-f toolsets/${{ matrix.toolset }}/toolset.yaml"
          fi
          if [ -n "$MCP_INGRESS_HOST" ]; then
            values="$values --set ingress.enabled=true --set ingress.host=$MCP_INGRESS_HOST --set ingress.tlsSecret=${MCP_NAMESPACE}-tls"
          fi
          helm upgrade --install "mcp-${{ matrix.toolset }}" infra/k8s/charts/mcp-toolset \
            --namespace "$MCP_NAMESPACE" \
            --set name="${{ matrix.toolset }}" \
            --set image.repository="${{ steps.image.outputs.repository }}" \
            --set image.tag="${{ github.sha }}" \
            $values

  reconcile:
    needs: detect
    # Removing a toolset always touches shared paths (uv.lock, root
    # pyproject.toml), so any removal lands in a run with a non-empty matrix;
    # docs-only pushes skip, keeping kubeconfig out of no-op runs.
    if: needs.detect.outputs.toolsets != '[]' && needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      - name: Uninstall releases whose toolset directory is gone
        env:
          # The chat's switch, read here so that clearing it takes the release
          # down. The chat job is merely skipped without a model, and a release
          # nothing uninstalls keeps answering — and spending the key — with
          # every appearance of being off.
          MCP_CHAT_MODEL: ${{ vars.MCP_CHAT_MODEL }}
        run: |
          for release in $(helm list --namespace "$MCP_NAMESPACE" --short); do
            case "$release" in
              # The releases this workflow installs that are not toolsets. A
              # name here that stops being skipped is uninstalled on the next
              # deploy, because no toolsets/<name> directory will ever back it.
              mcp-index) continue ;;
              mcp-chat)
                if [ -z "$MCP_CHAT_MODEL" ]; then
                  echo "Uninstalling $release: MCP_CHAT_MODEL is unset, so no chat"
                  helm uninstall "$release" --namespace "$MCP_NAMESPACE"
                fi
                continue ;;
              mcp-*) toolset="${release#mcp-}" ;;
              *) continue ;;
            esac
            if [ ! -d "toolsets/$toolset" ]; then
              echo "Uninstalling $release: toolsets/$toolset no longer exists"
              helm uninstall "$release" --namespace "$MCP_NAMESPACE"
            fi
          done

  index:
    needs: detect
    # Skip no-op pushes (e.g. docs): the index image is built from shared code,
    # and any shared-code change already selects all toolsets in detect.
    if: needs.detect.outputs.ingress == 'true' && needs.detect.outputs.toolsets != '[]' && needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: image
        name: Compute image name (ghcr requires lowercase)
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY@L}/mcp-index" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          # The sentinel the Dockerfile branches on: install the runtime alone
          # (the `index` dependency group) — no toolsets, no UI build.
          build-args: TOOLSET=index
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=mcp-index
          cache-to: type=gha,scope=mcp-index,mode=max
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      - name: Deploy with Helm
        env:
          MCP_INGRESS_HOST: ${{ secrets.MCP_INGRESS_HOST }}
        run: |
          helm upgrade --install mcp-index infra/k8s/charts/mcp-index \
            --namespace "$MCP_NAMESPACE" \
            --set image.repository="${{ steps.image.outputs.repository }}" \
            --set image.tag="${{ github.sha }}" \
            --set ingress.host="$MCP_INGRESS_HOST" \
            --set ingress.tlsSecret=${MCP_NAMESPACE}-tls

  chat:
    needs: detect
    # The hosted chat UI: the runtime's agent over HTTP and the web client it
    # serves. Gated like the index (shared code selects all toolsets; docs-only
    # pushes skip), and on naming a model — which is what turns the chat on,
    # here and on the AWS target, because it is the one input both can see.
    # The key it spends is checked below rather than gated on: a deployment
    # that named a model and forgot the key wanted a chat, and silence would
    # leave it wondering where it went.
    if: needs.detect.outputs.ingress == 'true' && vars.MCP_CHAT_MODEL != '' && needs.detect.outputs.toolsets != '[]' && needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The model has a key to answer on
        env:
          PROVIDER_API_KEY: ${{ secrets.MCP_PROVIDER_API_KEY }}
          # Through the environment rather than into the script text: a value
          # substituted into `run` becomes shell source, and a quote in it is
          # then a syntax error at best.
          MCP_CHAT_MODEL: ${{ vars.MCP_CHAT_MODEL }}
        run: |
          if [ -z "$PROVIDER_API_KEY" ]; then
            echo "::error::MCP_CHAT_MODEL names $MCP_CHAT_MODEL, but there is" \
                 "no MCP_PROVIDER_API_KEY secret to answer on it. Set it" \
                 "(gh secret set MCP_PROVIDER_API_KEY), or clear the" \
                 "MCP_CHAT_MODEL variable to deploy no chat."
            exit 1
          fi
      - id: image
        name: Compute image name (ghcr requires lowercase)
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY@L}/mcp-chat" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.chat
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=mcp-chat
          cache-to: type=gha,scope=mcp-chat,mode=max
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      - name: Deploy with Helm
        env:
          MCP_INGRESS_HOST: ${{ secrets.MCP_INGRESS_HOST }}
          # Optional override; defaults to chat.<shared-domain>. Needs its own
          # DNS record and (with cert-manager) a cert for the chat host.
          MCP_CHAT_HOST: ${{ secrets.MCP_CHAT_HOST }}
          # The model, and the key it is billed to. The key is a secret; the
          # model is not, so it is a variable — and it is the variable this job
          # is gated on, so it is always set by the time we get here.
          PROVIDER_API_KEY: ${{ secrets.MCP_PROVIDER_API_KEY }}
          MCP_CHAT_MODEL: ${{ vars.MCP_CHAT_MODEL }}
        run: |
          chat_host="${MCP_CHAT_HOST:-chat.$MCP_INGRESS_HOST}"
          # --set-file, not --set: helm reads commas in a --set value as
          # separators, and an API key containing one would arrive truncated
          # and be wrong in a way that looks like a rejected key. printf
          # rather than echo, because a trailing newline would go into the
          # Secret and travel out on the Authorization header.
          printf '%s' "$PROVIDER_API_KEY" > "$RUNNER_TEMP/provider-key"
          helm upgrade --install mcp-chat infra/k8s/charts/mcp-chat \
            --namespace "$MCP_NAMESPACE" \
            --set image.repository="${{ steps.image.outputs.repository }}" \
            --set image.tag="${{ github.sha }}" \
            --set ingress.host="$chat_host" \
            --set ingress.tlsSecret=${MCP_NAMESPACE}-chat-tls \
            --set provider.model="$MCP_CHAT_MODEL" \
            --set-file provider.apiKey="$RUNNER_TEMP/provider-key"
