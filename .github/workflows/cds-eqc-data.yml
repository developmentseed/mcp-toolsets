name: CDS EQC Data Snapshot

# Fetches the CDS EQC corpus, builds the sgrep index (incl. the bundled
# embedding model), and uploads the whole data tree as the `eqc-data` artifact.
# The cds toolset Docker image bakes this in: deploy.yml downloads the latest
# successful run's artifact into the build context before building.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: toolsets/cds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --frozen --package cds

      - name: Fetch EQC corpus
        run: uv run python scripts/fetch_eqc_corpus.py --workers 2

      - name: Sanity-check snapshot
        run: |
          uv run python -c "
          import sys
          from cds.eqc.sgrep import data_status
          ok, detail = data_status(min_datasets=1)
          print(detail)
          sys.exit(0 if ok else 1)
          "

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: eqc-data
          path: toolsets/cds/data
          retention-days: 90
          if-no-files-found: error
