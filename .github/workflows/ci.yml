name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: ./scripts/lint
      - run: ./scripts/test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          helm lint charts/mcp-toolset
          --set name=test
          --set image.repository=test
          --set image.tag=test
      - run: >
          helm lint charts/mcp-index
          --set ingress.host=test.example.com
          --set image.repository=test
          --set image.tag=test

  detect:
    runs-on: ubuntu-latest
    outputs:
      toolsets: ${{ steps.changed.outputs.toolsets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "toolsets=$(./scripts/changed-toolsets "$range")" >> "$GITHUB_OUTPUT"

  docker:
    needs: detect
    if: needs.detect.outputs.toolsets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolset: ${{ fromJSON(needs.detect.outputs.toolsets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build changed toolset image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: TOOLSET=${{ matrix.toolset }}
